# cargo-deny config for the ncz-os Rust quality gate. Schema v2.
[advisories]
version = 2
unmaintained = "workspace"
# Known low-risk transitive advisories (no upstream fix available in current tree).
# All transitive, none an active exploitable vuln; the gate still catches NEW advisories.
ignore = [
  "RUSTSEC-2021-0145", # atty: unaligned read (Windows-only, needs custom global allocator)
  "RUSTSEC-2024-0375", # atty: unmaintained
  "RUSTSEC-2024-0436", # paste: unmaintained
  "RUSTSEC-2025-0134", # rustls-pemfile: unmaintained
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Unicode-DFS-2016", "Zlib",
  "MPL-2.0", "CC0-1.0", "0BSD", "CDLA-Permissive-2.0", "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
